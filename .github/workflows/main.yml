name: DBT Test with Snowflake Table Creation

on:
  workflow_dispatch:

jobs:
  run_dbt_tests:
    runs-on: ubuntu-latest

    env:
      SNOWSQL_ACCOUNT: ${{ secrets.SNOWSQL_ACCOUNT }}
      SNOWSQL_USER: ${{ secrets.SNOWSQL_USER }}
      SNOWSQL_PWD: ${{ secrets.SNOWSQL_PWD }}
      SNOWSQL_ROLE: ${{ secrets.SNOWSQL_ROLE }}
      SNOWSQL_WAREHOUSE: ${{ secrets.SNOWSQL_WAREHOUSE }}
      SNOWSQL_DATABASE: ${{ secrets.SNOWSQL_DATABASE }}
      SNOWSQL_SCHEMA: ${{ secrets.SNOWSQL_SCHEMA }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dbt & deps
        run: |
          pip install dbt-core dbt-snowflake

      - name: Install SnowSQL
        run: |
          curl -O https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.2/linux_x86_64/snowsql-linux_x86_64.bash
          bash snowsql-linux_x86_64.bash

      - name: Add SnowSQL to PATH
        run: echo "$HOME/.snowsql/bin" >> $GITHUB_PATH

      - name: Create table in Snowflake
        run: |
          snowsql -f scripts/create_table.sql

      - name: Extract metadata from Snowflake
        run: |
          mkdir -p metadata
          snowsql -q "SELECT COLUMN_NAME FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME = 'YOUR_TABLE_NAME' AND TABLE_SCHEMA = '${{ env.SNOWSQL_SCHEMA }}'" \
            -o output_format=csv -o header=true -o output_file=metadata/columns.csv

      - name: Generate test YAML via dbt macro
        run: |
          dbt run-operation generate_test_yaml --args '{"input_path": "metadata/columns.csv", "output_path": "models/generated/test_cases.yml"}'

      - name: Show generated test YAML
        run: cat models/generated/test_cases.yml

      - name: Run dbt deps
        run: dbt deps

      - name: Run dbt test
        run: dbt test
